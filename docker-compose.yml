services:
  postgres:
    image: postgres:16
    container_name: docuflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docuflow
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: docuflow
    ports:
      - "5432:5432"
    volumes:
      - docuflow_pgdata:/var/lib/postgresql/data

volumes:
  docuflow_pgdata:
